version: '3.8'

services:
  # AlgoForge Trading Engine
  engine:
    build: .
    container_name: algoforge-engine
    environment:
      - ALGOFORGE_MODE=paper
      - DATABASE_URL=postgresql://algoforge:algoforge@timescaledb:5432/algoforge
      - REDIS_URL=redis://redis:6379
      - DASHBOARD_WS_PORT=8080
    ports:
      - "8080:8080"   # WebSocket dashboard
      - "9090:9090"   # Prometheus metrics
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - engine-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Dashboard
  dashboard:
    build: ./dashboard
    container_name: algoforge-dashboard
    environment:
      - NEXT_PUBLIC_WS_URL=ws://engine:8080/ws
    ports:
      - "3000:3000"
    depends_on:
      - engine
    restart: unless-stopped

  # TimescaleDB (PostgreSQL with time-series extensions)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: algoforge-timescaledb
    environment:
      - POSTGRES_USER=algoforge
      - POSTGRES_PASSWORD=algoforge
      - POSTGRES_DB=algoforge
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (Event Bus in production)
  redis:
    image: redis:7-alpine
    container_name: algoforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: algoforge-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - engine
    restart: unless-stopped

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: algoforge-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=algoforge
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  engine-data:
  timescale-data:
  redis-data:
  prometheus-data:
  grafana-data:
