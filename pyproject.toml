[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algoforge"
version = "0.1.0"
description = "Institutional-grade algorithmic trading system with 31 strategies, 5 market regimes, and absolute risk veto"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AlgoForge Team" },
]

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings[yaml]>=2.2",
    "structlog>=24.1",
    "redis>=5.0",
    "httpx>=0.27",
    "yfinance>=0.2.36",
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "stable-baselines3>=2.2",
    "shap>=0.44",
]
dev = [
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "fakeredis[aioredis]>=2.21",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
