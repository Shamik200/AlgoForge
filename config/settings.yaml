# AlgoForge Configuration v0.2.0
# Override any value with env vars: ALGOFORGE_<SECTION>__<KEY>

market:
  selected_market: stocks_us
  timeframe_mode: intraday
  paper_trading_capital: 100000.0
  currency: USD

redis:
  host: localhost
  port: 6379
  db: 0
  password: null
  max_connections: 20
  socket_timeout: 5.0

timescaledb:
  host: localhost
  port: 5432
  database: algoforge
  user: algoforge
  password: ""
  min_connections: 5
  max_connections: 20
  ssl: false

data_feed:
  provider: yfinance
  symbols:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - TSLA
  base_timeframe: "1m"
  history_period: "1mo"
  poll_interval_seconds: 60
  max_retries: 3
  retry_delay_seconds: 2.0

binance:
  base_url: https://api.binance.com
  ws_url: wss://stream.binance.com:9443/ws
  api_key: null
  api_secret: null
  rate_limit_per_minute: 1200

alphavantage:
  api_key: ""
  base_url: https://www.alphavantage.co/query
  rate_limit_per_minute: 25

event_bus:
  max_queue_size: 10000
  enable_streams: true
  stream_max_len: 100000

worker_pool:
  pool_size: 20
  max_queue_size: 10000
  backpressure_threshold: 5000

logging:
  level: INFO
  format: json
  log_file: logs/algoforge.log
  log_to_stdout: true

risk:
  max_risk_per_trade_pct: 2.0
  max_position_size_pct: 10.0
  min_risk_reward_ratio: 2.0
  max_open_positions: 5
  max_daily_loss_pct: 5.0
  max_weekly_loss_pct: 10.0
  max_drawdown_pct: 20.0
  mandatory_stop_loss: true

strategy:
  primary_strategy: trendline_pullback
  min_confirmation_candles: 1
  ema_periods: [5, 9, 21, 50, 100, 200]
  rsi_period: 14
  adx_period: 14
  atr_period: 14
