# ============================================================================
# AlgoForge Configuration Template v0.2.0
# ============================================================================
# This template provides comprehensive documentation for all configuration
# parameters including valid ranges, defaults, and usage guidelines.
#
# Override any value with environment variables using the pattern:
# ALGOFORGE_<SECTION>__<KEY>
#
# Example: ALGOFORGE_MARKET__PAPER_TRADING_CAPITAL=50000.0
# ============================================================================

# ----------------------------------------------------------------------------
# Market Configuration
# ----------------------------------------------------------------------------
# Controls market selection, trading mode, and capital allocation
market:
  # Selected market for trading
  # Valid values: stocks_us, forex, crypto, commodities, stocks_eu, stocks_asia
  # Default: stocks_us
  selected_market: stocks_us

  # Timeframe mode for trading
  # Valid values: intraday, daily, weekly
  # Default: intraday
  timeframe_mode: intraday

  # Initial capital for paper trading
  # Valid range: > 0 (recommended: >= 10000.0)
  # Default: 100000.0
  # Warning: Values < 1000 may limit position sizing effectiveness
  paper_trading_capital: 100000.0

  # Base currency for trading
  # Valid values: USD, EUR, GBP, JPY, AUD, CAD, CHF, CNY
  # Default: USD
  currency: USD

# ----------------------------------------------------------------------------
# Redis Configuration
# ----------------------------------------------------------------------------
# Redis is used for event streaming and caching
redis:
  # Redis server hostname
  # Default: localhost
  host: localhost

  # Redis server port
  # Valid range: 1-65535
  # Default: 6379
  port: 6379

  # Redis database number
  # Valid range: 0-15
  # Default: 0
  db: 0

  # Redis password (null for no authentication)
  # Default: null
  # Warning: Recommended to set password for production
  password: null

  # Maximum number of connections in the pool
  # Valid range: 1-100
  # Default: 20
  max_connections: 20

  # Socket timeout in seconds
  # Valid range: > 0
  # Default: 5.0
  socket_timeout: 5.0

# ----------------------------------------------------------------------------
# TimescaleDB Configuration
# ----------------------------------------------------------------------------
# PostgreSQL with TimescaleDB extension for persistent OHLCV storage
timescaledb:
  # Database server hostname
  # Default: localhost
  host: localhost

  # Database server port
  # Valid range: 1-65535
  # Default: 5432
  port: 5432

  # Database name
  # Default: algoforge
  database: algoforge

  # Database user
  # Default: algoforge
  user: algoforge

  # Database password
  # Default: "" (empty string)
  # Warning: Recommended to set password for production
  password: ""

  # Minimum connections in the pool
  # Valid range: 1-100
  # Default: 5
  min_connections: 5

  # Maximum connections in the pool
  # Valid range: >= min_connections
  # Default: 20
  max_connections: 20

  # Enable SSL connection
  # Default: false
  # Recommended: true for production
  ssl: false

# ----------------------------------------------------------------------------
# Data Feed Configuration
# ----------------------------------------------------------------------------
# Controls which data provider, symbols, and timeframes to ingest
data_feed:
  # Data provider
  # Valid values: yfinance, binance, alphavantage
  # Default: yfinance
  # Note: Requires corresponding API credentials when using binance or alphavantage
  provider: yfinance

  # List of symbols to trade
  # Valid range: At least 1 symbol required
  # Warning: > 100 symbols may impact performance and rate limits
  # Default: [AAPL, MSFT, GOOGL, AMZN, TSLA]
  symbols:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - TSLA

  # Base timeframe for data ingestion
  # Valid values: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w
  # Default: 1m
  base_timeframe: "1m"

  # Historical data period to load on startup
  # Valid values: 1d, 5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, max
  # Default: 1mo
  history_period: "1mo"

  # Polling interval in seconds for data updates
  # Valid range: >= 1 (recommended: >= 10)
  # Default: 60
  # Warning: < 10 may hit rate limits
  poll_interval_seconds: 60

  # Maximum number of retries on data fetch failure
  # Valid range: >= 0 (recommended: <= 10)
  # Default: 3
  # Warning: > 10 may cause long delays on persistent failures
  max_retries: 3

  # Delay between retries in seconds
  # Valid range: > 0
  # Default: 2.0
  retry_delay_seconds: 2.0

# ----------------------------------------------------------------------------
# Binance Configuration
# ----------------------------------------------------------------------------
# Required when using Binance as data provider (crypto markets)
binance:
  # Binance API base URL
  # Default: https://api.binance.com
  base_url: https://api.binance.com

  # Binance WebSocket URL
  # Default: wss://stream.binance.com:9443/ws
  ws_url: wss://stream.binance.com:9443/ws

  # Binance API key
  # Required when provider=binance
  # Set via environment variable: ALGOFORGE_BINANCE__API_KEY
  api_key: null

  # Binance API secret
  # Required when provider=binance
  # Set via environment variable: ALGOFORGE_BINANCE__API_SECRET
  api_secret: null

  # Rate limit per minute
  # Valid range: 1-1200
  # Default: 1200
  rate_limit_per_minute: 1200

# ----------------------------------------------------------------------------
# Alpha Vantage Configuration
# ----------------------------------------------------------------------------
# Required when using Alpha Vantage as data provider (forex/stocks)
alphavantage:
  # Alpha Vantage API key
  # Required when provider=alphavantage
  # Set via environment variable: ALGOFORGE_ALPHAVANTAGE__API_KEY
  api_key: ""

  # Alpha Vantage API base URL
  # Default: https://www.alphavantage.co/query
  base_url: https://www.alphavantage.co/query

  # Rate limit per minute
  # Valid range: 1-500 (free tier: 25)
  # Default: 25
  rate_limit_per_minute: 25

# ----------------------------------------------------------------------------
# Event Bus Configuration
# ----------------------------------------------------------------------------
# Controls event queue sizes and Redis Streams configuration
event_bus:
  # Maximum queue size for in-memory events
  # Valid range: >= 100 (recommended: >= 1000)
  # Default: 10000
  # Warning: < 100 may cause event loss under high load
  max_queue_size: 10000

  # Enable Redis Streams for event persistence
  # Default: true
  enable_streams: true

  # Maximum length of Redis Streams
  # Valid range: >= 1000 (recommended: >= 10000)
  # Default: 100000
  # Warning: < 1000 may limit event history for debugging
  stream_max_len: 100000

# ----------------------------------------------------------------------------
# Worker Pool Configuration
# ----------------------------------------------------------------------------
# Controls concurrent processing of multiple instruments
worker_pool:
  # Number of worker threads
  # Valid range: >= 1 (recommended: <= 100)
  # Default: 20
  # Warning: > 100 may cause excessive resource usage
  pool_size: 20

  # Maximum queue size for pending tasks
  # Valid range: >= 100 (recommended: >= 1000)
  # Default: 10000
  # Warning: < 100 may cause backpressure issues
  max_queue_size: 10000

  # Backpressure threshold (must be < max_queue_size)
  # Valid range: 0 to max_queue_size - 1
  # Default: 5000
  backpressure_threshold: 5000

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
# Controls structured logging output and verbosity
logging:
  # Log level
  # Valid values: DEBUG, INFO, WARNING, ERROR, CRITICAL
  # Default: INFO
  level: INFO

  # Log format
  # Valid values: json, console
  # Default: json
  # Recommended: json for production, console for development
  format: json

  # Log file path (null to disable file logging)
  # Default: logs/algoforge.log
  log_file: logs/algoforge.log

  # Enable logging to stdout
  # Default: true
  log_to_stdout: true

# ----------------------------------------------------------------------------
# Risk Management Configuration
# ----------------------------------------------------------------------------
# CRITICAL: These parameters control position sizing and loss limits
# Ensure daily < weekly < drawdown for proper risk hierarchy
risk:
  # Maximum risk per trade as percentage of capital
  # Valid range: > 0, <= 100 (recommended: 1-5)
  # Default: 2.0
  max_risk_per_trade_pct: 2.0

  # Maximum position size as percentage of capital
  # Valid range: > 0, <= 100 (recommended: 5-20)
  # Default: 10.0
  # Note: Should be >= max_risk_per_trade_pct
  max_position_size_pct: 10.0

  # Minimum risk/reward ratio for trade entry
  # Valid range: > 0 (recommended: >= 1.5)
  # Default: 2.0
  # Warning: < 1.0 means accepting negative expected value
  min_risk_reward_ratio: 2.0

  # Maximum number of concurrent open positions
  # Valid range: >= 1 (recommended: 3-10)
  # Default: 5
  # Warning: > 50 may lead to over-diversification
  max_open_positions: 5

  # Maximum daily loss as percentage of capital
  # Valid range: > 0, <= 100 (recommended: 2-5)
  # Default: 5.0
  # CRITICAL: Must be < max_weekly_loss_pct < max_drawdown_pct
  max_daily_loss_pct: 5.0

  # Maximum weekly loss as percentage of capital
  # Valid range: > 0, <= 100 (recommended: 5-10)
  # Default: 10.0
  # CRITICAL: Must be > max_daily_loss_pct and < max_drawdown_pct
  max_weekly_loss_pct: 10.0

  # Maximum drawdown as percentage of capital (kill switch)
  # Valid range: > 0, <= 100 (recommended: 15-25)
  # Default: 20.0
  # CRITICAL: Must be > max_weekly_loss_pct
  max_drawdown_pct: 20.0

  # Mandatory stop loss on all trades
  # Valid values: true, false
  # Default: true
  # WARNING: NEVER set to false - trading without stop losses is extremely dangerous
  mandatory_stop_loss: true

# ----------------------------------------------------------------------------
# Strategy Configuration
# ----------------------------------------------------------------------------
# Controls strategy selection and technical indicator parameters
strategy:
  # Primary strategy to use
  # Valid values: trendline_pullback, ema_crossover, breakout, mean_reversion, momentum
  # Default: trendline_pullback
  primary_strategy: trendline_pullback

  # Minimum confirmation candles before entry
  # Valid range: >= 1, <= 5 (recommended: 1-3)
  # Default: 1
  # Warning: > 5 may cause missed opportunities
  min_confirmation_candles: 1

  # EMA periods for moving average calculations
  # Valid range: At least 2 periods (recommended: 3-6 periods)
  # Default: [5, 9, 21, 50, 100, 200]
  # Note: Should be in ascending order
  ema_periods: [5, 9, 21, 50, 100, 200]

  # RSI period
  # Valid range: >= 2 (recommended: 14)
  # Default: 14
  rsi_period: 14

  # ADX period
  # Valid range: >= 2 (recommended: 14)
  # Default: 14
  adx_period: 14

  # ATR period
  # Valid range: >= 2 (recommended: 14)
  # Default: 14
  atr_period: 14

# ============================================================================
# End of Configuration Template
# ============================================================================
